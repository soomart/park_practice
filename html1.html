<!-- Ctrl + Space : 자동완성 -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>서식01</title>
    </head>
    <body>
        <!-- <marquee>개쩌는 텍스트 </marquee> -->
         <h1>
            <sup>제목</sup>입술의 말
         </h1>

         <p>
            <i>
                <q>뭐해요?</q>
           </i>라는 말은 <br />
           <strong>
            <ins>걱정한다는 뜻.</ins>
           </strong>
         </p>

         <p>
            <i>오늘 날씨가 추워요.</i>라는 말은<br />
            <d><del>좋아한다는 뜻.</del></d>
         

            <p>
                <em>그만 좀 먹어라.</em>라는 말은<br />
                <strong>
                    <mark>그만 좀 먹어라는 뜻입니다.</mark>
                </strong>     
            </p>
         </p>
    </body>
</html>
